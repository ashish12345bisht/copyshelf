[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "copyshelf"
version = "0.2.0"
description = "Clipboard history for Linux: press Super+V to paste something you copied earlier"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Ashish Bisht"}]
# PyGObject + GTK 3 normally come from your distro's packages (see README).
dependencies = ["PyGObject>=3.42"]

[project.urls]
Homepage = "https://github.com/ashish12345bisht/copyshelf"

[project.scripts]
copyshelf = "copyshelf.__main__:main"

[tool.setuptools.packages.find]
include = ["copyshelf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Raised by PyGObject's own Gtk import on GLib 2.86+, not by our code.
    "ignore:GLib.unix_signal_add_full is deprecated",
]
